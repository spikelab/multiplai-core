[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiplai-core"
dynamic = ["version"]
description = "Shared library for the Multiplai Claude Code plugins — paths, config, logging, model client."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Spike", email = "fsm@spikelab.org" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Loose ranges: this is a library, so exact pins would make it unsolvable
# alongside any consumer (or sibling dep) that needs a different version.
dependencies = [
    "anthropic>=0.122.0,<2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# claude-agent-sdk is optional so API-only consumers stay light. NOTE: nothing
# injects it at runtime — PEP 723 uv scripts get a fresh isolated env, so any
# consumer that wants the SDK backend MUST depend on `multiplai-core[sdk]`
# explicitly. Without it, AgentSDKClient degrades to the API backend, which
# needs an API key.
#
# Floor is >=0.2.168, raised from >=0.2.139 on 2026-10-16: 0.2.168 bundles
# Claude CLI 2.1.301, and the floor moves in step with multiplai-kit's so the
# shared venv re-syncs to it. No 0.2.168 API is required by this code. This
# overrides the loose-floor policy in .github/dependabot.yml on purpose: core
# owns the SDK for the whole stack, so its floor sets the version every
# consumer runs.
#
# The >=0.2.139 reason (raised from >=0.2.116 on 2026-08-15) still holds:
# `run_agent` forwards `thinking` into `ClaudeAgentOptions(**opts_kwargs)`; an
# SDK without that field raises TypeError on every call that sets it, so
# consumers were detecting the gap at runtime instead. A floor moves that to
# install time, where a resolver can refuse.
#
# The original >=0.2.116 reason still holds underneath: the 0.1.x line misparses
# the terminal result message emitted by modern Claude CLIs (>=2.x), raising the
# notorious `Claude Code returned an error result: success` after a full
# generation, deterministically, so the retry wrapper cannot help.
#
# Keep this floor aligned with multiplai-kit (`requirements.txt`) and
# multiplai-gui (`hub/pyproject.toml`) so all SDK consumers resolve compatibly.
#
# Ceiling is <0.3: claude-agent-sdk is a fast-moving 0.x package where a single
# minor bump (0.1 -> 0.2) already shipped a breaking result-message parse
# change. Without a cap, a downstream consumer that doesn't vendor our lock
# could resolve a future 0.3.x/1.0 fresh and silently re-break the same way.
sdk = ["claude-agent-sdk>=0.2.168,<0.3"]
# load_env() needs python-dotenv; without this extra it degrades to a no-op
# with a warning.
dotenv = ["python-dotenv>=1.0"]
# packaging is a direct test dependency (tests/test_pyproject_sdk_floor.py
# parses Requirement specs) — declared explicitly, not leaned on as a
# transitive dep of pytest.
dev = ["pytest>=8.0", "packaging>=24"]

[project.urls]
Homepage = "https://github.com/spikelab/multiplai-core"
Repository = "https://github.com/spikelab/multiplai-core"

[tool.hatch.version]
# Single source of truth for the version — no hand-duplicated string to drift.
path = "src/multiplai_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/multiplai_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.1"
extend-exclude = []
# no line-length (88 default), no select/extend-select
